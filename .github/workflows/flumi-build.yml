name: Build Flumi

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      GODOT_VERSION: "4.4"
      EXPORT_DIR: "build"
      LINUX_NAME: "Flumi-Linux-x86_64"
      WINDOWS_NAME: "Flumi-Windows-x86_64"

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot (headless) and templates
        run: |
          set -euxo pipefail
          mkdir -p tools/godot
          cd tools/godot
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.4-stable/Godot_v4.4-stable_macos.universal.zip"
          unzip -q godot.zip
          # Find the Godot binary (works for both plain file and inside a folder)
          FOUND=$(find . -type f -name "Godot*" | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "Godot binary not found after unzip!"
            exit 1
          fi
          mv "$FOUND" Godot
          chmod +x Godot
          cd -
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/4.4.stable"
          mkdir -p "${TEMPLATES_DIR}"
          curl -L -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz"
          unzip -q templates.tpz -d templates_unpacked
          cp -R templates_unpacked/templates/* "${TEMPLATES_DIR}/"


      - name: Export Linux build
        run: |
          set -euxo pipefail
          mkdir -p build
          cd flumi
          ../tools/godot/Godot --headless --path . --export-release "Linux" "../build/${LINUX_NAME}.x86_64"

      - name: Export Windows build
        run: |
          set -euxo pipefail
          mkdir -p build/Windows
          cd flumi
          ../tools/godot/Godot --headless --path . --export-release "Windows Desktop" "../build/Windows/${WINDOWS_NAME}.exe"

      - name: Create Linux archive
        run: |
          set -euxo pipefail
          cd build
          tar -czf "${LINUX_NAME}.tar.gz" "${LINUX_NAME}.x86_64" "${LINUX_NAME}.pck" *.so 2>/dev/null || true

      - name: Download UPX
        run: |
          set -euxo pipefail
          mkdir -p tools/upx
          cd tools/upx
          curl -L -o upx.tar.xz "https://github.com/upx/upx/releases/download/v5.0.2/upx-5.0.2-amd64_linux.tar.xz"
          tar -xf upx.tar.xz
          cd -

      - name: Compress Windows executables with UPX
        run: |
          set -euxo pipefail
          cd build/Windows
          ls -la
          # Compress all exe and dll files that exist
          for file in *.exe *.dll; do
            if [ -f "$file" ]; then
              echo "Compressing $file"
              ../../tools/upx/upx-5.0.2-amd64_linux/upx --best --ultra-brute "$file"
            fi
          done

      - name: Create custom InnoSetup Dockerfile
        run: |
          set -euxo pipefail
          cat > Dockerfile.innosetup << 'EOF'
          FROM docker.io/amake/innosetup
          USER root
          ENV HOME /home/xclient
          ENV WINEPREFIX /home/xclient/.wine
          ENV WINEARCH win32
          RUN chown -R root /home
          WORKDIR /work
          ENTRYPOINT ["iscc"]
          EOF

      - name: Build custom InnoSetup Docker image
        run: |
          set -euxo pipefail
          docker build -f Dockerfile.innosetup -t flumi-innosetup .

      - name: Build Windows installer
        run: |
          set -euxo pipefail
          mkdir -p build/Windows/installer
          
          docker run --rm \
            -v "$PWD:/work" \
            -w /work/flumi/build-scripts \
            flumi-innosetup flumi-workflow-installer.iss

      - name: Create Windows installer archive
        run: |
          set -euxo pipefail
          cd build/Windows/installer
          if [ -f "Flumi-Setup-Latest.exe" ]; then
            zip -j "../../Flumi-Windows-x86_64.zip" "Flumi-Setup-Latest.exe"
          else
            echo "Installer not found!"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: builds-${{ github.sha }}
          path: |
            build/Flumi-Linux-x86_64.tar.gz
            build/Flumi-Windows-x86_64.zip
          if-no-files-found: warn
          retention-days: 14

  build-macos:
    runs-on: macos-latest
    
    env:
      GODOT_VERSION: "4.4"
      EXPORT_DIR: "build"
      MACOS_NAME: "Flumi-macOS-universal"

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot (headless) and templates
        run: |
          set -euxo pipefail
          mkdir -p tools/godot
          cd tools/godot
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.4-stable/Godot_v4.4-stable_macos.universal.zip"
          unzip -q godot.zip
          ls -la
          mv Godot_v4.4-stable_macos.universal Godot
          chmod +x Godot
          cd -
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/4.4.stable"
          mkdir -p "${TEMPLATES_DIR}"
          curl -L -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz"
          unzip -q templates.tpz -d templates_unpacked
          cp -R templates_unpacked/templates/* "${TEMPLATES_DIR}/"

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Compile GDExtension for Intel macOS
        run: |
          set -euxo pipefail
          cd protocol/gdextension
          chmod +x build.sh
          ./build.sh --platform macos-intel --target release

      - name: Compile GDExtension for ARM macOS
        run: |
          set -euxo pipefail
          cd protocol/gdextension
          ./build.sh --platform macos --target release

      - name: Create Universal Binary
        run: |
          set -euxo pipefail
          cd protocol/gdextension
          mkdir -p addon/gurt-protocol/bin/macos
          lipo -create -output addon/gurt-protocol/bin/macos/libgurt_godot.dylib \
            target/x86_64-apple-darwin/release/libgurt_godot.dylib \
            target/aarch64-apple-darwin/release/libgurt_godot.dylib
          echo "Universal binary created:"
          file addon/gurt-protocol/bin/macos/libgurt_godot.dylib

      - name: Copy GDExtension addon to project
        run: |
          set -euxo pipefail
          cd protocol/gdextension
          cp -r addon/gurt-protocol ../../flumi/addons/

      - name: Export macOS build
        run: |
          set -euxo pipefail
          mkdir -p build
          cd flumi
          ../tools/godot/Godot --headless --path . --export-release "macOS" "../build/${MACOS_NAME}.app"

      - name: Check exported files
        run: |
          set -euxo pipefail
          cd build
          echo "Files in build directory:"
          ls -la
          echo "Files in .app bundle:"
          ls -la "${MACOS_NAME}.app/Contents/MacOS/"
          echo "Files in .app bundle Resources:"
          ls -la "${MACOS_NAME}.app/Contents/Resources/" || echo "No Resources directory"

      - name: Install create-dmg
        run: |
          set -euxo pipefail
          brew install create-dmg

      - name: Convert ICO to ICNS
        run: |
          set -euxo pipefail
          mkdir -p build/icon.iconset
          sips -s format png ../flumi/Assets/gurted.ico --out build/icon.iconset/icon_512x512.png
          iconutil -c icns build/icon.iconset -o build/gurted.icns
          echo "Generated ICNS file:"
          ls -lh build/gurted.icns

      - name: Create macOS archive
        run: |
          set -euxo pipefail
          cd build
          zip -r "${MACOS_NAME}.zip" "${MACOS_NAME}.app"

      - name: Create DMG installer
        run: |
          set -euxo pipefail
          cd build
          
          mkdir -p dmg_contents
          cp -R "Flumi-macOS-universal.app" dmg_contents/
          
          if [ -f "Flumi-macOS-universal.pck" ]; then
            echo "Found .pck file, copying to app bundle"
            cp "Flumi-macOS-universal.pck" "dmg_contents/Flumi-macOS-universal.app/Contents/Resources/"
          fi
          
          for dylib in *.dylib; do
            if [ -f "$dylib" ]; then
              echo "Found additional dylib: $dylib"
              cp "$dylib" "dmg_contents/Flumi-macOS-universal.app/Contents/MacOS/"
            fi
          done
          
          create-dmg \
            --volname "Flumi" \
            --volicon "gurted.icns" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --icon-size 100 \
            --icon "Flumi-macOS-universal.app" 175 120 \
            --hide-extension "Flumi-macOS-universal.app" \
            --app-drop-link 425 120 \
            "Flumi-macOS-universal.dmg" \
            "dmg_contents/"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: builds-macos-${{ github.sha }}
          path: |
            build/Flumi-macOS-universal.zip
            build/Flumi-macOS-universal.dmg
          if-no-files-found: warn
          retention-days: 14
